<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#07152e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- Outer Frame -->
  <rect width="800" height="550" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="4" />
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />
  
  <!-- Header Branding -->
  <text x="400" y="75" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SCALER TOPICS</text>
  <text x="400" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CERTIFICATE OF COMPLETION</text>
  
  <line x1="250" y1="125" x2="550" y2="125" stroke="url(#accent)" stroke-width="2" />
  
  <!-- Certificate Recipient & Title -->
  <text x="400" y="175" font-family="system-ui, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">This is to certify that</text>
  <text x="400" y="225" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">MUKESH KUMAR R</text>
  
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">has successfully mastered the course</text>
  <text x="400" y="315" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">Python Course for Beginners with Certification</text>
  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">Mastering the Essentials</text>
  
  <!-- Footer Info -->
  <text x="150" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Issued: November 2025</text>
  <line x1="80" y1="455" x2="220" y2="455" stroke="#334155" stroke-width="1" />
  <text x="150" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Date of Issuance</text>
  
  <!-- Verified Badge -->
  <circle cx="400" cy="435" r="30" fill="url(#gold)" opacity="0.9" />
  <path d="M388 435 l8 8 l16 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1">VERIFIED CREDENTIAL</text>
  
  <text x="650" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Scaler Topics</text>
  <line x1="580" y1="455" x2="720" y2="455" stroke="#334155" stroke-width="1" />
  <text x="650" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Authorized Signature</text>
</svg>
