<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="aws-cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6fffa" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-sig { font-family: 'Caveat', cursive; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#aws-cert-bg)" />

  <!-- Top Left Header -->
  <text x="80" y="110" class="font-sans" font-size="24" font-weight="800" fill="#0f172a">AWS Training &amp; Certification</text>
  <text x="80" y="142" class="font-sans" font-size="20" font-weight="500" fill="#334155">Completion Certificate</text>

  <!-- Certificate Title -->
  <text x="80" y="240" class="font-sans" font-size="44" font-weight="700" fill="#0f172a">AWS Cloud Practitioner</text>
  <text x="80" y="295" class="font-sans" font-size="44" font-weight="700" fill="#0f172a">Essentials</text>
  <text x="80" y="340" class="font-sans" font-size="17" font-weight="500" fill="#334155">Completed: July 02, 2026</text>

  <!-- Awarded to -->
  <text x="80" y="440" class="font-sans" font-size="16" font-weight="500" fill="#475569">Awarded to</text>
  <text x="80" y="480" class="font-sans" font-size="34" font-weight="700" fill="#0f172a">Mukeshkumar R</text>

  <!-- Signature Section -->
  <g transform="translate(80, 560)">
    <!-- Signature Cursive Line -->
    <path d="M0 -15 C15 -40, 25 10, 45 -25 C55 -40, 65 0, 85 -20 C95 -30, 105 -5, 125 -15 C135 -25, 145 -35, 160 -10 C170 5, 180 -40, 195 -15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="22" class="font-sans" font-size="15" font-weight="600" fill="#1e293b">Michelle Vaz</text>
    <text x="0" y="42" class="font-sans" font-size="14" font-weight="500" fill="#475569">Director, AWS Training &amp; Certification</text>
  </g>

  <!-- AWS Logo (Bottom Right) -->
  <g transform="translate(740, 545) scale(1.4)">
    <!-- AWS Text -->
    <path d="M11.6 27.2h-3.4L3.8 6.4h3.6l3.1 16.5 3.5-16.5h3.3l3.5 16.5 3.1-16.5h3.6L20 27.2h-3.4l-3.3-15.8zM31.2 27.5c-4.2 0-7.2-2.1-7.2-5.7 0-3.6 2.8-5.3 7.8-5.7l4.5-.4v-1.1c0-1.7-1.1-2.6-3.2-2.6-1.9 0-3.5.7-4.6 1.8l-1.9-2.3c1.7-1.7 4.1-2.7 6.9-2.7 4.3 0 6.4 2.2 6.4 5.9v10.4h-3.3v-2.3c-1.3 1.7-3.2 2.7-5.4 2.7zm1.1-3.1c2.1 0 4.1-1.1 4.1-3.2v-1.4l-3.6.3c-2.8.2-4.3 1.1-4.3 2.8 0 1.2.9 1.5 3.8 1.5zM45.6 27.5c-3.7 0-6.1-1.5-6.8-3.7l3.1-1.2c.5 1.4 1.9 2.2 3.8 2.2 1.8 0 3.1-.7 3.1-1.9 0-1.1-.9-1.6-3.4-2.1-3.8-.8-5.7-2.1-5.7-4.8 0-3.2 2.7-5.2 6.2-5.2 3.2 0 5.4 1.3 6.3 3.3l-2.9 1.3c-.5-1.1-1.7-1.8-3.3-1.8-1.7 0-2.8.7-2.8 1.7 0 1 .9 1.4 3.2 1.9 4.1.8 5.9 2.1 5.9 4.9.2 3.4-2.7 5.4-6.7 5.4z" fill="#1e293b"/>
