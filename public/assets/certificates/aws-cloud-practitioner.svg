    <path d="M49.8 35.8c-7.3 5.4-17.9 8.2-27.1 8.2-12.8 0-24.4-4.8-33.1-12.7-.7-.6-.1-1.4.7-1 8.8 5 19.5 8.1 30.5 8.1 8.2 0 17.5-2.2 25-6.2 1.2-.6 2.2 1.1 1 2.3z" fill="#ff9900"/>
    <path d="M52.4 33.1c-.9-.7-5.9-.6-8-.3-.6.1-.7-.4-.2-.8 3.5-2.6 9.2-2.1 10.1-.9.9 1.1-.2 6.9-3.3 10.1-.4.4-.9.2-.7-.3.7-2.1 1.7-7.2 2.1-7.8z" fill="#ff9900"/>
